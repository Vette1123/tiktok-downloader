name: Deploy to Cloudflare Workers

# Push to main deploys. Pull requests build and size-check only — never deploy,
# so a PR can't take production down or race the live Worker.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time. Queued pushes supersede each other rather than racing
  # two `wrangler deploy` calls at the same Worker.
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # youtube-dl-exec's preinstall hard-fails when it can't find a Python
  # interpreter. The binary is aliased away in the Worker bundle and never runs
  # on workerd anyway, so the check is pure friction here.
  YOUTUBE_DL_SKIP_PYTHON_CHECK: '1'
  # NEXT_PUBLIC_* is inlined at build time, so it has to be set for `next build`
  # — a Worker var would be read too late to affect the bundle.
  # Set this repository variable to your final workers.dev/custom-domain URL.
  # The fallback is build-safe and, unlike the upstream value, never sends
  # visitors to somebody else's deployment.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://social-media-downloader-cn.workers.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Linux, deliberately: the OpenNext bundler mirrors pnpm's nested
    # node_modules using symlinks, which Windows refuses without Developer Mode
    # or elevation.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose — package.json's `packageManager` field
      # pins the exact pnpm release, and the action errors out if both are set.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Parser fixtures and route behaviour must pass before a build can be
      # considered usable. This is especially important for the Chinese
      # platform adapters, whose upstream response shapes change frequently.
      - name: Run unit tests
        run: pnpm test

      # No separate typecheck or lint step on purpose.
      #
      # `next build` type-checks the project itself (nothing sets
      # typescript.ignoreBuildErrors), so a `tsc --noEmit` step could only ever
      # fail where the build would already have failed — it just spent another
      # ~30s doing it. Lint was `continue-on-error: true`, so it gated nothing
      # and only produced output nobody read. Both belong on a developer's
      # machine before pushing, which is where they now run.
      # Static export into out/ (pages, images, robots, sitemap) plus the
      # _headers file and the completeness checks in scripts/cf-postbuild.mjs.
      - name: Build static site
        run: pnpm cf:build

      # Fails the run before deploying on either budget the Worker has to stay
      # inside: the free plan's 3 MiB gzipped upload limit, and the bundle size
      # that decides how much CPU a new isolate spends compiling before it can
      # answer anything. See scripts/worker-startup.mjs for why the second one
      # is the tighter constraint in practice. Runs on pull requests too, where
      # nothing deploys.
      - name: Check bundle size and isolate startup cost
        run: |
          pnpm exec wrangler deploy --dry-run --outdir .worker-size-check
          pnpm cf:startup .worker-size-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runs after the deploy is live, because it reads the deployed sitemap to
      # collect the URL set. The script swallows its own failures — a flaky
      # search-engine endpoint must never fail a deploy.
      - name: Ping IndexNow
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.mjs --force
